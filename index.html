---
layout: default
title: Purdue Parking Finder
---
<div id="controls">
  <label for="passType">Pass type</label>
  <select id="passType">
    <option value="">All pass types</option>
  </select>

  <label for="building">Going to</label>
  <select id="building">
    <option value=""></option>
  </select>

  <button type="button" id="locateButton">Use my location</button>

  <label class="checkbox">
    <input type="checkbox" id="accessibleToggle" checked>
    Show accessible parking
  </label>
</div>

<div id="statusMessage" role="status" hidden></div>

<div class="map-layout">
  <div id="map"></div>
  <aside id="results" aria-live="polite" hidden></aside>
</div>
